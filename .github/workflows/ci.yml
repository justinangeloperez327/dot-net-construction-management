name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CPM.slnx

      - name: Build
        run: dotnet build CPM.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CPM.slnx --configuration Release --no-build --verbosity normal
