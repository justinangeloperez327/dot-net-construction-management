name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore CPM.slnx

      - name: Build
        run: dotnet build CPM.slnx --configuration Release --no-restore

      - name: Generate Group 6 migration preview
        env:
          ConnectionStrings__Database: "Server=localhost;Database=ConstructionManagement;User ID=sa;Password=NotUsedInMigration1!;TrustServerCertificate=True"
        run: |
          dotnet ef migrations add AddClientsAndProjectMembers --project src/Infrastructure --startup-project src/Web --output-dir Persistence/Migrations --configuration Release --no-build

          for file in src/Infrastructure/Persistence/Migrations/*AddClientsAndProjectMembers*; do
            echo "===== BEGIN $file ====="
            cat "$file"
            echo "===== END $file ====="
          done

          echo "===== BEGIN src/Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs ====="
          cat src/Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs
          echo "===== END src/Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs ====="

      - name: Test
        run: dotnet test CPM.slnx --configuration Release --no-build --verbosity normal
